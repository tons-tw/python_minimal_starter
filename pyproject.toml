[project]
name = "tons-tw-python-minimal-starter"
version = "0.1.0"
description = "THIS IS THE WAY!"
readme = "README.md"
license = "MIT"
authors = [
  { name = "CHANG, TZU-YEN", email = "tom@tons.tw" },
]
requires-python = "==3.14.*"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
]

[dependency-groups]
dev = [
  "pyproject-fmt~=2.21.2",
  "pytest~=9.0.3",
  "pytest-cov~=7.1.0",
  "ruff~=0.15.22",
]

[tool.ruff]
line-length = 80
indent-width = 2
format.line-ending = "lf"
format.docstring-code-format = true
lint.extend-select = [
  "A",    # no shadowing builtins
  "B",    # common bugs
  "BLE",  # no blind except
  "C4",   # better comprehensions
  "ERA",  # no commented-out code
  "FLY",  # use f-strings
  "FURB", # modern Python idioms
  "I",    # import sorting
  "ISC",  # implicit string concat
  "N",    # naming conventions
  "PGH",  # pygrep hooks
  "PIE",  # unnecessary code
  "PLE",  # pylint errors
  "PLW",  # pylint warnings
  "PT",   # pytest style
  "RUF",  # ruff-specific
  "SIM",  # simplify code
  "T10",  # no debugger left behind
  "UP",   # modern Python syntax
]

[tool.pyproject-fmt]
column_width = 80
indent = 2

[tool.pytest]
ini_options.python_files = [ "*_test.py" ]
ini_options.pythonpath = [ "src" ]
ini_options.addopts = "--cov=src --cov-report term-missing --cov-fail-under=100"

[tool.coverage]
run.branch = true
run.omit = [ "*_test.py", "src/main.py" ]
run.relative_files = true
